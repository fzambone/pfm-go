# Merge-to-main full quality gate — triggers on every push to main (PR merge,
# rebase, or admin direct push). Runs the complete suite: lint, unit tests,
# integration tests (GitHub Actions Postgres service container + real SQL), and build.
# Deployment workflows may only trigger after this gate passes.
# All action versions are pinned; no `latest` references.

name: Merge Quality Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-gate:
    name: full-gate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine3.23
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

      - name: Test (unit)
        run: go test -race -count=1 ./...

      - name: Download integration modules
        # testcontainers-go and its transitive deps are only pulled by integration
        # build tags. The unit-test step above does not download them, so they
        # would be fetched during the test run itself (adding latency). This step
        # warms the module cache before compilation and test execution begins.
        run: go mod download

      - name: Test (integration)
        env:
          TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/postgres?sslmode=disable
        run: go test -tags integration -race -count=1 ./...

      - name: Build
        run: make build
